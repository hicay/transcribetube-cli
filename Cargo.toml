[package]
name = "transcribetube-cli"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
description = "Transcribe YouTube videos to text, SRT, VTT, or markdown from your terminal or from AI assistants via MCP."
homepage = "https://transcribetube.com"
repository = "https://github.com/hicay/transcribetube-cli"
license = "MIT"
keywords = ["youtube", "transcript", "subtitles", "mcp", "cli"]
categories = ["command-line-utilities"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "llms.txt", "AI_INTEGRATION.md"]

[lib]
name = "transcribetube_cli"
path = "src/lib.rs"

[[bin]]
name = "tube"
path = "src/main.rs"

[[bin]]
name = "transcribetube-mcp"
path = "src/bin/transcribetube-mcp.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
