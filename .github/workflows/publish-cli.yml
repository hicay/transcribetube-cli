# Auto-publish workflow for @transcribetube/cli.
#
# One-time setup:
#   1. Create the `@transcribetube` org/scope on npmjs.com.
#   2. Generate an npm "Automation" access token.
#   3. Add it as the `NPM_TOKEN` repository secret (Settings → Secrets → Actions).
#
# Release flow:
#   npm version patch
#   git commit -am "release X.Y.Z"
#   git tag vX.Y.Z && git push origin main --tags

name: Publish CLI to npm

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: read
    id-token: write # required for npm provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'npm'

            - name: Verify tag matches package version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  PKG_VERSION="$(node -p "require('./package.json').version")"
                  TAG_VERSION="${GITHUB_REF#refs/tags/v}"
                  echo "package.json: $PKG_VERSION | tag: $TAG_VERSION"
                  if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
                    echo "::error::Tag v$TAG_VERSION does not match package version $PKG_VERSION"
                    exit 1
                  fi

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build CLI
              run: npm run build

            - name: Test CLI
              run: npm test

            - name: Abort if version already published
              run: |
                  NAME="$(node -p "require('./package.json').name")"
                  VERSION="$(node -p "require('./package.json').version")"
                  if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                    echo "::error::$NAME@$VERSION is already on npm. Bump the version first."
                    exit 1
                  fi

            - name: Publish to npm
              run: npm publish --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
